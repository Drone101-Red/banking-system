services:
  postgres:
    image: postgres:16-alpine
    container_name: banking-postgres
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: secret123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking_user -d banking"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - banking_net

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.17.9
    container_name: banking-tigerbeetle
    security_opt:
      - seccomp=unconfined
    entrypoint: ["/bin/sh", "/tb-entrypoint.sh"]
    volumes:
      - tb_data:/data
      - ./scripts/tb-entrypoint.sh:/tb-entrypoint.sh:ro
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "pidof tigerbeetle > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      banking_net:
        ipv4_address: 172.30.0.10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    security_opt:
      - seccomp=unconfined
    container_name: banking-backend
    depends_on:
      postgres:
        condition: service_healthy
      tigerbeetle:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: banking
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: secret123
      APP_PORT: 8080
      APP_ENV: development
      TB_ADDRESS: ${TB_ADDRESS}
      TB_CLUSTER_ID: ${TB_CLUSTER_ID}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      RECONCILE_INTERVAL_MINUTES: ${RECONCILE_INTERVAL_MINUTES:-5}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
    ports:
      - "8080:8080"
    networks:
      - banking_net

volumes:
  postgres_data:
  tb_data:

networks:
  banking_net:
    ipam:
      config:
        - subnet: 172.30.0.0/24